<!--
  Yourebrand — isologo (megáfono).

  Redibujado a partir del PNG que pasó Thomy. Es una reconstrucción
  vectorial fiel, no el archivo original.

  Para usar el original: dejá el archivo en marca/assets/isologo.png
  (o isologo.svg) y el renderer lo prefiere automáticamente sobre este.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 325" fill="none">
  <g stroke="#111111" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">

    <!-- Mango, colgando por debajo de la boquilla -->
    <rect x="74" y="228" width="52" height="78" rx="24" fill="#D9D9D9"/>

    <!-- Bulbo rojo que asoma detrás de la placa frontal -->
    <path d="M362 110 a58 58 0 0 1 0 114" fill="#E9203F"/>

    <!-- Cono principal -->
    <path d="M145 107 L335 16 L335 306 L145 223 Z" fill="#D9D9D9"/>

    <!-- Boquilla trasera: cápsula redondeada -->
    <rect x="8" y="105" width="137" height="120" rx="60" fill="#D9D9D9"/>

    <!-- Banda roja -->
    <rect x="72" y="105" width="73" height="120" fill="#E9203F"/>

    <!-- Placa frontal -->
    <rect x="334" y="14" width="34" height="294" rx="14" fill="#D9D9D9"/>

    <!-- Marcas interiores del cono -->
    <path d="M303 62 L303 106 M303 226 L303 270"/>

    <!-- Ondas de sonido -->
    <path d="M420 112 L494 66 M428 167 L516 167 M418 222 L506 254"/>
  </g>
</svg>
