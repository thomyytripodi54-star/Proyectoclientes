<title>Mapa de creadoras Yourebrand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700;800;900&display=swap">
<style>
/* Layout: mapa 3D a sangre en todo el fondo; HUD encima (barra superior, panel de creadoras a la izquierda, controles y lecturas en los bordes). En celular el panel baja debajo del mapa.
   Mundo visual único y oscuro (manual: fondo grafito #272626, negro para alto contraste, rojo #D30805 como acento ≤10%). */
:root{
  --red:#D30805; --red-80:#DC3937; --red-40:#ED9C9B;
  --graphite:#272626; --g80:#525151; --g60:#7D7D7D; --g40:#A9A8A8; --g20:#D4D4D4;
  --black:#000000; --white:#FFFFFF;
  --bg:#0B0B0B; --panel:rgba(22,21,21,.78); --panel-solid:#1B1A1A; --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --fg:#FFFFFF; --muted:#A9A8A8;
  --font:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.dot{color:var(--red)}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr}
#stage{position:absolute;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.placing canvas{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lab{position:absolute;left:0;top:0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);white-space:nowrap;will-change:transform;text-shadow:0 1px 4px #000}
.lab.caba{font-weight:900;font-size:13px;color:#fff;letter-spacing:.2em}
.lab.on{color:#fff}

/* Barra superior */
.top{position:relative;z-index:3;display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-weight:900;font-size:22px;letter-spacing:-.03em}
.logo small{font-weight:200;font-size:10.5px;color:rgba(255,255,255,.7);margin-top:4px}
.vr{width:1px;height:36px;background:var(--line-2)}
.ttl{font-size:22px;line-height:1;letter-spacing:-.02em;font-weight:200}
.ttl b{font-weight:900}
.kpis{display:flex;gap:0;margin-left:auto}
.kpi{padding:0 18px;border-left:1px solid var(--line-2);display:flex;flex-direction:column}
.kpi:first-child{border-left:0}
.kpi strong{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.kpi span{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.01em}
.btn-main{background:var(--red);color:#fff}
.btn-main:hover{background:var(--red-80)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-danger{background:transparent;color:#fff;border:1px solid var(--red)}
.btn:disabled{opacity:.5;cursor:default}

/* Panel */
.body{position:relative;z-index:2;min-height:0;pointer-events:none;display:grid;grid-template-columns:350px 1fr;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));gap:20px}
.side{pointer-events:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.filters{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.flabel{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--g20)}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:#000}
.range{display:flex;align-items:center;gap:8px}
.inp{padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(0,0,0,.35);width:100%}
.range .inp{width:76px;font-variant-numeric:tabular-nums}
.list{overflow:auto;flex:1;min-height:0;padding:8px}
.item{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;background:transparent;width:100%;text-align:left;transition:background .2s,border-color .2s}
.item:hover{background:rgba(255,255,255,.06)}
.item.on{border-color:var(--red);background:rgba(211,8,5,.08)}
.av{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:var(--graphite);color:#fff;display:grid;place-items:center;font-weight:900;border:2px solid #fff;position:relative}
.item .t{min-width:0;flex:1}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12px;color:var(--muted)}
.cov{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-height:120px;overflow:auto}
.cov b{color:#fff;font-weight:700}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:#fff;font-size:16px;font-weight:900;margin-bottom:6px;letter-spacing:-.01em}

/* HUD del mapa */
.hud{position:relative;pointer-events:none;min-height:0}
.hud>*{pointer-events:auto}
.mapctl{position:absolute;right:0;top:0;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);cursor:pointer;font-size:16px;font-weight:700;display:grid;place-items:center}
.mapctl button[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.mapctl button svg{width:18px;height:18px}
.legend{position:absolute;left:0;bottom:0;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;display:grid;gap:7px}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px}
.legend label{display:flex;align-items:center;gap:8px;cursor:pointer;padding-top:4px;border-top:1px solid var(--line)}
.legend input{accent-color:var(--red)}
.readout{position:absolute;right:0;bottom:0;display:flex;gap:14px;align-items:flex-end;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.scale{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.scale i{display:block;height:6px;border:1.5px solid #fff;border-top:0;transition:width .2s}
.live{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;backdrop-filter:blur(10px)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
.live.off::before{background:var(--g60);animation:none}
@keyframes blink{50%{opacity:.25}}
.banner{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:700;display:flex;gap:10px;align-items:center;max-width:calc(100% - 110px)}
.banner button{background:#000;color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.tip{position:fixed;z-index:5;pointer-events:none;background:#fff;color:#000;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
.tip b{font-weight:900}

/* Hoja lateral */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet>.card{background:var(--panel-solid);border-left:1px solid var(--line);width:min(470px,100%);height:100%;overflow:auto;padding-block:26px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.sheet h2{margin:0;font-size:26px;font-weight:900;line-height:1;letter-spacing:-.03em;text-wrap:balance}
.x{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
.hd{display:flex;align-items:center;gap:16px}
.big{width:100px;height:100px;font-size:30px;border-width:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phone{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;user-select:all;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid a,.grid div{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--graphite);display:block;position:relative;max-width:100%}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block}
.grid button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.links a{color:#fff;word-break:break-all;display:block;font-weight:600;text-decoration-color:var(--red)}
.sec h3{margin:0 0 9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
form{display:grid;gap:14px}
.f{display:grid;gap:6px}
.f label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.err{color:#fff;background:var(--red);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;margin:0}
.loc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
.confirm{border:1px solid var(--red);border-radius:12px;padding:14px;display:grid;gap:8px}
select.inp option{background:#1B1A1A}

@media (max-width:820px){
  body{overflow:auto}
  html,body{height:auto}
  .app{height:auto;display:block}
  #stage{position:relative;height:64vh;inset:auto}
  #labels{top:0;height:64vh}
  .top{position:absolute;top:0;left:0;right:0;gap:12px;padding-block:12px}
  .ttl,.vr{display:none}
  .kpis{margin-left:0;width:100%}
  .kpi{flex:1;padding:0 10px}
  .kpi strong{font-size:22px}
  .top .btn-main{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;padding:9px 14px}
  .body{display:block;padding-top:16px}
  .hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(64vh - 120px);height:104px}
  .legend{display:none}
  .mapctl{flex-direction:row;top:auto;bottom:0;right:auto;left:0}
  .readout .scale{display:none}
  .side{max-height:none}
  .list{max-height:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <header class="top">
    <div class="logo"><b>Yourebrand<span class="dot">.</span></b><small>Agencia Full service de marketing digital.</small></div>
    <div class="vr"></div>
    <div class="ttl">Mapa de <b>creadoras</b><span class="dot"><b>.</b></span></div>
    <div class="kpis">
      <div class="kpi"><strong id="sTotal">0</strong><span>Creadoras</span></div>
      <div class="kpi"><strong id="sZonas">0</strong><span>Zonas cubiertas</span></div>
      <div class="kpi"><strong id="sSin">36</strong><span>Sin cobertura</span></div>
    </div>
    <button class="btn btn-main" id="addBtn" type="button">+ Agregar creadora</button>
  </header>

  <div class="body">
    <aside class="side">
      <div class="filters">
        <input class="inp" id="q" type="search" placeholder="Buscar por nombre o zona" aria-label="Buscar">
        <div><div class="flabel">Género</div><div class="chips" id="fGen"></div></div>
        <div>
          <div class="flabel"><span>Edad</span><span id="ageInfo"></span></div>
          <div class="range">
            <input class="inp" id="aMin" type="number" min="14" max="99" placeholder="Desde" aria-label="Edad mínima">
            <span>a</span>
            <input class="inp" id="aMax" type="number" min="14" max="99" placeholder="Hasta" aria-label="Edad máxima">
            <button class="btn btn-ghost" id="clearF" type="button" style="padding:8px 12px">Limpiar</button>
          </div>
        </div>
        <div><div class="flabel">Zona</div><div class="chips" id="fZona"></div></div>
      </div>
      <div class="list" id="list"></div>
      <div class="cov" id="cov"></div>
    </aside>

    <section class="hud" id="hud">
      <div class="banner" id="banner" hidden><span>Tocá el mapa donde vive</span><button type="button" id="cancelPlace">Cancelar</button></div>
      <div class="mapctl">
        <button type="button" id="zin" aria-label="Acercar">+</button>
        <button type="button" id="zout" aria-label="Alejar">−</button>
        <button type="button" id="zfit" aria-label="Ver todo el GBA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button type="button" id="tilt" aria-label="Cambiar entre vista 3D y vista desde arriba">3D</button>
        <button type="button" id="spin" aria-label="Rotación automática" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button>
      </div>
      <div class="legend">
        <div><span class="sw" style="background:#3A3939"></span>Sin creadoras</div>
        <div><span class="sw" style="background:#4A0F0D;box-shadow:inset 0 0 0 1.5px #D30805"></span>1 creadora</div>
        <div><span class="sw" style="background:#8A0B08;box-shadow:inset 0 0 0 1.5px #D30805"></span>2 o más</div>
        <label><input type="checkbox" id="showRad" checked> Radio de cobertura</label>
      </div>
      <div class="readout">
        <div class="scale"><span id="scaleTxt">10 km</span><i id="scaleBar" style="width:80px"></i></div>
        <div id="coord">34.6037° S · 58.3816° O</div>
        <div class="live off" id="status">Conectando</div>
      </div>
    </section>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="sheet" id="sheet" hidden><div class="card" id="sheetCard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const GEO = __GEO__;
const GENEROS = ["Mujer","Varón","No binario"];
const ZONAS = ["CABA","Conurbano 1º cordón","Conurbano 2º/3º cordón","Gran La Plata"];
const RED = 0xD30805;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const S = { creadoras: [], sel: null, gen:new Set(), zona:new Set(), q:"", aMin:null, aMax:null, placing:null, db:null, assets:null, mode:"cargando", spin:!REDUCED };

/* ---------- Proyección: km planos alrededor de CABA ---------- */
const LNG0=-58.45, LAT0=-34.62, KX=Math.cos(34.62*Math.PI/180)*111.32, KY=110.95;
const toXZ = (lng,lat) => [(lng-LNG0)*KX, -(lat-LAT0)*KY];
const toLL = (x,z) => [x/KX+LNG0, -z/KY+LAT0];
function ptInPoly(pt, ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [xi,yi]=ring[i],[xj,yj]=ring[j];if(((yi>pt[1])!=(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c}return c}
function zonaDe(lng,lat){for(const p of GEO)for(const r of p.r)if(ptInPoly([lng,lat],r))return p;return null}

/* ---------- Escena ---------- */
const stage=$("stage");
let renderer=null, scene, camera, composer=null, bloom=null;
const parts={}; // nombre -> {mesh, line, h, target, cap, side, lab}
const pinLayer = new (window.THREE?THREE.Group:Object)();
const pins = new Map(); // id -> objetos
let scanRing, particles, grid;
const cam={tx:0,tz:0,dist:150,yaw:0,el:1.25}, goal={tx:0,tz:0,dist:58,yaw:-0.25,el:0.92};

function init3D(){
  if(!window.THREE) return false;
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"}); }catch(e){ return false; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setClearColor(0x0B0B0B,1);
  stage.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0B0B0B,0.0065);
  camera=new THREE.PerspectiveCamera(42,1,0.5,2000);
  scene.add(new THREE.AmbientLight(0xffffff,0.45));
  const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(-40,90,60);scene.add(dl);
  

  // piso: grilla técnica
  grid=new THREE.GridHelper(600,120,0x2E2D2D,0x1A1919);grid.position.y=-0.02;grid.material.transparent=true;grid.material.opacity=.9;scene.add(grid);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({color:0x0E0E0E}));water.rotation.x=-Math.PI/2;water.position.y=-0.05;scene.add(water);

  // partidos extruidos
  GEO.forEach((p,i)=>{
    const shapes=p.r.map(r=>{const s=new THREE.Shape();r.slice(0,-1).forEach(([lng,lat],k)=>{const [x,z]=toXZ(lng,lat);k?s.lineTo(x,-z):s.moveTo(x,-z)});return s});
    const geo=new THREE.ExtrudeGeometry(shapes,{depth:1,bevelEnabled:false});
    const cap=new THREE.MeshStandardMaterial({color:p.n==="CABA"?0x3F3E3E:0x302F2F,roughness:.85,metalness:.15,emissive:0x000000});
    const side=new THREE.MeshStandardMaterial({color:0x1A1919,roughness:.9,metalness:.1,emissive:0x000000});
    const mesh=new THREE.Mesh(geo,[cap,side]);mesh.rotation.x=-Math.PI/2;mesh.scale.z=0.01;mesh.userData.part=p.n;
    const pts=[];p.r.forEach(r=>{for(let k=0;k<r.length-1;k++){const a=toXZ(...r[k]),b=toXZ(...r[k+1]);pts.push(a[0],-a[1],1.002,b[0],-b[1],1.002)}});
    const lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
    const line=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.28}));
    mesh.add(line);scene.add(mesh);
    const [cx,cz]=toXZ(...p.c);
    const lab=document.createElement("div");lab.className="lab"+(p.n==="CABA"?" caba":"");lab.textContent=p.n;$("labels").appendChild(lab);
    parts[p.n]={mesh,line,cap,side,h:0.01,target:0.4,cx,cz,lab,delay:Math.hypot(cx,cz)*18+200,hover:0};
  });

  // anillo de escaneo
  scanRing=new THREE.Mesh(new THREE.RingGeometry(0.985,1,160),new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:.6,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
  scanRing.rotation.x=-Math.PI/2;scanRing.position.y=0.6;scene.add(scanRing);

  // partículas
  const N=900,pp=new Float32Array(N*3);for(let i=0;i<N;i++){pp[i*3]=(Math.random()-.5)*220;pp[i*3+1]=Math.random()*40;pp[i*3+2]=(Math.random()-.5)*200}
  const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));

/* ---------- Pines ---------- */
function avatarCanvas(c,img,sel){
  const cv=document.createElement("canvas");cv.width=cv.height=256;const g=cv.getContext("2d");
  g.beginPath();g.arc(128,128,118,0,Math.PI*2);g.fillStyle=sel?"#D30805":"#FFFFFF";g.fill();
  g.save();g.beginPath();g.arc(128,128,104,0,Math.PI*2);g.clip();
  if(img){const k=Math.max(208/img.width,208/img.height);g.drawImage(img,128-img.width*k/2,128-img.height*k/2,img.width*k,img.height*k)}

  g.restore();
  // la firma: punto rojo
  g.beginPath();g.arc(206,206,26,0,Math.PI*2);g.fillStyle="#D30805";g.fill();g.lineWidth=8;g.strokeStyle="#0B0B0B";g.stroke();
  return cv;
}
function dashedCircle(){const pts=[];const N=72;for(let i=0;i<N;i+=2){const a=i/N*Math.PI*2,b=(i+1)/N*Math.PI*2;pts.push(Math.cos(a),0,Math.sin(a),Math.cos(b),0,Math.sin(b))}const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));return g}
const DASH = window.THREE?dashedCircle():null;

  o.sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,sizeAttenuation:false,depthTest:false,transparent:true}));o.sprite.renderOrder=10;o.sprite.userData.id=c.id;o.tex=tex;
  o.beam=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1,8,1,true),new THREE.MeshBasicMaterial({color:0xFF4038,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  o.rings=[0,.5].map(off=>{const m=new THREE.Mesh(new THREE.RingGeometry(.42,.55,48),new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:.8,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.x=-Math.PI/2;m.userData.off=off;return m});
  o.disc=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshBasicMaterial({color:RED,transparent:true,opacity:.09,depthTest:false,depthWrite:false,side:THREE.DoubleSide}));o.disc.rotation.x=-Math.PI/2;o.disc.renderOrder=4;

}
function updatePin(o,c){
  o.c=c;const key=(c.foto||"")+"|"+(S.sel===c.id)+"|"+c.nombre;
  if(key!==o.key){o.key=key;const sel=S.sel===c.id;o.tex.image=avatarCanvas(c,null,sel);o.tex.needsUpdate=true;
    if(c.foto){const img=new Image();img.onload=()=>{if(o.key===key){o.tex.image=avatarCanvas(c,img,sel);o.tex.needsUpdate=true}};img.src=imgSrc(c.foto)}}
  const [x,z]=toXZ(c.lng,c.lat);o.x=x;o.z=z;o.group.position.set(x,0,z);

function syncPins(){
  if(!renderer)return;
  const vs=visibles().filter(c=>typeof c.lat==="number");const ids=new Set(vs.map(c=>c.id));
  for(const [id,o] of pins){if(!ids.has(id)){pinLayer.remove(o.group);o.tex.dispose();pins.delete(id)}}
  vs.forEach(c=>{const o=pins.get(c.id);o?updatePin(o,c):buildPin(c)});
}

/* ---------- Bucle de animación ---------- */
const clock={t0:performance.now()};let lastW=0,lastH=0,hoverPart=null;
const v3=window.THREE?new THREE.Vector3():null;
function frame(now){
  requestAnimationFrame(frame);
  const t=(now-clock.t0)/1000;
  const W=stage.clientWidth,H=stage.clientHeight;
  if(W!==lastW||H!==lastH){lastW=W;lastH=H;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();if(composer){composer.setSize(W,H)}}
  // cámara suave
  const k=REDUCED?1:0.06;
  for(const key of ["tx","tz","dist","yaw","el"])cam[key]+=(goal[key]-cam[key])*k;
  const sway=S.spin&&!dragging?Math.sin(t*.12)*.22:0;
  if(S.spin&&!dragging){goal.yaw+=0.0006}
  const yaw=cam.yaw+sway*0.3;
  camera.position.set(cam.tx+cam.dist*Math.cos(cam.el)*Math.sin(yaw),cam.dist*Math.sin(cam.el),cam.tz+cam.dist*Math.cos(cam.el)*Math.cos(yaw));
  camera.lookAt(cam.tx,0,cam.tz);
  // alturas de partidos (entrada escalonada + transición)
  const el=now-clock.t0;
  for(const n in parts){const p=parts[n];const tg=el>p.delay||REDUCED?p.target+p.hover*.35:0.01;p.h+=(tg-p.h)*(REDUCED?1:.07);p.mesh.scale.z=Math.max(p.h,.01)}
  // escaneo
  if(!REDUCED){const ph=(t%6)/6;scanRing.scale.setScalar(2+ph*95);scanRing.material.opacity=.55*(1-ph)}else scanRing.visible=false;
  // partículas
  if(!REDUCED){const a=particles.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)+.012;if(y>40)y=0;a.setY(i,y)}a.needsUpdate=true;particles.rotation.y=t*.01}
  // pines
  for(const o of pins.values()){
    const pz=zonaPart(o.c);const top=pz?pz.h:.4;const sel=S.sel===o.c.id;
    const bob=REDUCED?0:Math.sin(t*1.6+o.phase)*.25;const hy=top+5+bob+(sel?1.2:0);
    o.sprite.position.y=hy;const sc=sel?.105:.075;o.sprite.scale.set(sc,sc,1);
    o.beam.position.y=(top+hy)/2;o.beam.scale.y=hy-top;
    o.rings.forEach(r=>{const ph=REDUCED?.3:((t*.55+r.userData.off+o.phase)%1);r.position.y=top+.03;r.scale.setScalar(1+ph*5);r.material.opacity=.85*(1-ph)});
    const showR=$("showRad").checked;o.disc.visible=o.dash.visible=showR;o.disc.position.y=o.dash.position.y=top+.05;o.dash.rotation.y=REDUCED?0:t*.25*(o.phase>3?1:-1);
  }
  // etiquetas
  const showMinor=cam.dist<95;
  for(const n in parts){const p=parts[n];v3.set(p.cx,p.h+.3,p.cz).project(camera);
    const vis=v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1&&(showMinor||n==="CABA"||p.target>.5);
    if(!vis){if(p.lab.style.display!=="none")p.lab.style.display="none";continue}
    p.lab.style.display="";p.lab.style.transform=`translate(-50%,-50%) translate(${((v3.x+1)/2*W).toFixed(1)}px,${((1-v3.y)/2*H).toFixed(1)}px)`}
  // escala
  const wpp=cam.dist*2*Math.tan(camera.fov*Math.PI/360)/H;const steps=[1,2,5,10,20,50];let km=steps.find(s=>s/wpp>=60)||50;$("scaleBar").style.width=(km/wpp).toFixed(0)+"px";$("scaleTxt").textContent=km+" km";
  composer?composer.render():renderer.render(scene,camera);
}
function zonaPart(c){return parts[c.zona]||null}

/* ---------- Interacción: arrastrar, rotar, zoom, tocar ---------- */
const ray=window.THREE?new THREE.Raycaster():null, ndc=window.THREE?new THREE.Vector2():null;
const ground=window.THREE?new THREE.Plane(new THREE.Vector3(0,1,0),0):null;
function setNdc(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera)}
function groundPoint(){const p=new THREE.Vector3();return ray.ray.intersectPlane(ground,p)?p:null}
const pointers=new Map();let dragging=false,moved=0,pinchD=0,orbit=false;
function bindInput(){
  const cv=renderer.domElement;
  cv.addEventListener("contextmenu",e=>e.preventDefault());
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);moved=0;orbit=e.button===2||e.shiftKey;dragging=true;
    if(pointers.size===2){const [a,b]=[...pointers.values()];pinchD=Math.hypot(a[0]-b[0],a[1]-b[1])}cv.style.cursor=S.placing?"crosshair":"grabbing"});
  cv.addEventListener("pointermove",e=>{
    setNdc(e);const gp=groundPoint();if(gp){const [lng,lat]=toLL(gp.x,gp.z);$("coord").textContent=`${Math.abs(lat).toFixed(4)}° S · ${Math.abs(lng).toFixed(4)}° O`}
    if(!pointers.has(e.pointerId)){hover(e);return}
    const prev=pointers.get(e.pointerId);const dx=e.clientX-prev[0],dy=e.clientY-prev[1];pointers.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);$("tip").hidden=true;
    if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinchD){goal.dist=cam.dist=clamp(goal.dist*pinchD/d,8,230)}pinchD=d;return}
    if(orbit){goal.yaw-=dx*.005;goal.el=clamp(goal.el+dy*.004,.35,1.5);return}
    const s=cam.dist*2*Math.tan(camera.fov*Math.PI/360)/cv.clientHeight;const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);const f=1/Math.max(Math.sin(cam.el),.4);
    goal.tx-= (dx*cy + dy*sy*f)*s; goal.tz-= (-dx*sy + dy*cy*f)*s; cam.tx=goal.tx;cam.tz=goal.tz;
  });
  const end=e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size<2)pinchD=0;if(pointers.size)return;dragging=false;cv.style.cursor="";
    if(moved<6&&e.type==="pointerup"){setNdc(e);
      if(S.placing){const hit=ray.intersectObjects(Object.values(parts).map(p=>p.mesh));const gp=hit[0]?hit[0].point:groundPoint();if(gp){const [lng,lat]=toLL(gp.x,gp.z);S.placing(lng,lat)}return}
      const hs=ray.intersectObjects([...pins.values()].map(o=>o.sprite));if(hs[0]){select(hs[0].object.userData.id,false);return}
    }};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",()=>{$("tip").hidden=true;setHover(null)});
  cv.addEventListener("wheel",e=>{e.preventDefault();goal.dist=clamp(goal.dist*Math.exp(e.deltaY*.0012),8,230)},{passive:false});
}
function setHover(n){if(hoverPart===n)return;if(hoverPart&&parts[hoverPart]){parts[hoverPart].hover=0;parts[hoverPart].lab.classList.remove("on")}hoverPart=n;if(n&&parts[n]){parts[n].hover=1;parts[n].lab.classList.add("on")}}
function hover(e){
  const hs=ray.intersectObjects([...pins.values()].map(o=>o.sprite));const tip=$("tip");
  if(hs[0]){const c=pins.get(hs[0].object.userData.id).c;tip.innerHTML=`<b></b> · <span></span>`;tip.querySelector("b").textContent=c.nombre;tip.querySelector("span").textContent=[c.edad?c.edad+" años":"",c.zona].filter(Boolean).join(" · ");place(tip,e);renderer.domElement.style.cursor="pointer";setHover(c.zona);return}
  renderer.domElement.style.cursor=S.placing?"crosshair":"";
  const hit=ray.intersectObjects(Object.values(parts).map(p=>p.mesh))[0];
  if(hit){const n=hit.object.userData.part;setHover(n);const k=visibles().filter(c=>c.zona===n).length;tip.innerHTML=`<b></b> · <span></span>`;tip.querySelector("b").textContent=n;tip.querySelector("span").textContent=k?k+(k>1?" creadoras":" creadora"):"sin creadoras";place(tip,e)}
  else{setHover(null);tip.hidden=true}
}
function place(tip,e){tip.hidden=false;tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px"}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
$("zin").onclick=()=>goal.dist=clamp(goal.dist*.7,8,230);
$("zout").onclick=()=>goal.dist=clamp(goal.dist*1.4,8,230);
$("zfit").onclick=()=>{goal.tx=-8;goal.tz=10;goal.dist=150;goal.el=.95};
$("tilt").onclick=()=>{const top=goal.el<1.3;goal.el=top?1.5:.92;$("tilt").textContent=top?"2D":"3D"};
$("spin").onclick=()=>{S.spin=!S.spin;$("spin").setAttribute("aria-pressed",S.spin)};
$("spin").setAttribute("aria-pressed",S.spin);

/* ---------- Datos y lista ---------- */
const imgSrc = id => id ? "/_blob/"+id : "";
const iniciales = n => (n||"?").trim().split(/\s+/).slice(0,2).map(s=>s[0]).join("").toUpperCase();
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function avatar(c,cls){return c.foto?`<img class="${cls}" src="${imgSrc(c.foto)}" alt="">`:`<span class="${cls}">${esc(iniciales(c.nombre))}</span>`}
function visibles(){return S.creadoras.filter(c=>{
  if(S.gen.size&&!S.gen.has(c.genero))return false;
  const zg=(GEO.find(p=>p.n===c.zona)||{}).z||"";
  if(S.zona.size&&!S.zona.has(zg))return false;
  if(S.aMin!=null&&!(c.edad>=S.aMin))return false;
  if(S.aMax!=null&&!(c.edad<=S.aMax))return false;
  if(S.q){const q=S.q.toLowerCase();if(!((c.nombre||"").toLowerCase().includes(q)||(c.zona||"").toLowerCase().includes(q)))return false}
  return true})}
function countTo(el,v){const from=+el.textContent||0;if(from===v||REDUCED){el.textContent=v;return}const t0=performance.now();const step=n=>{const k=Math.min(1,(n-t0)/700);el.textContent=Math.round(from+(v-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

function render(){
  const vs=visibles();
  const counts={};vs.forEach(c=>{counts[c.zona]=(counts[c.zona]||0)+1});
  for(const n in parts){const k=counts[n]||0;const p=parts[n];p.target=0.4+Math.min(k,4)*1.1;
    p.cap.color.setHex(k>=2?0x8A0B08:k===1?0x4A0F0D:(n==="CABA"?0x3F3E3E:0x302F2F));p.cap.emissive.setHex(k>=2?0x1E0201:0);
    p.side.color.setHex(k?0x2A0605:0x1A1919);p.line.material.color.setHex(k?0xFF3A36:0xffffff);p.line.material.opacity=k?.9:.28}
  const all={};S.creadoras.forEach(c=>{all[c.zona]=(all[c.zona]||0)+1});
  const cub=GEO.filter(p=>all[p.n]).length;

  const L=$("list");L.innerHTML="";
  if(!S.creadoras.length){L.innerHTML=S.mode==="cargando"?`<div class="empty"><b>Cargando creadoras<span class="dot">.</span></b></div>`:`<div class="empty"><b>Sumá tu primera creadora<span class="dot">.</span></b>Nombre, teléfono, foto y dónde vive. Aparece en el mapa con su foto y su radio de cobertura.</div>`}
  else if(!vs.length){L.innerHTML=`<div class="empty"><b>Nadie con esos filtros<span class="dot">.</span></b>Ampliá el rango de edad o sacá algún filtro.</div>`}
  vs.sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).forEach(c=>{

    b.querySelector(".t b").textContent=c.nombre;b.querySelector(".t span").textContent=[c.edad?c.edad+" años":"",c.genero,c.zona].filter(Boolean).join(" · ");
    b.onclick=()=>select(c.id,true);L.appendChild(b)});

  $("ageInfo").textContent=vs.length!==S.creadoras.length?`${vs.length} de ${S.creadoras.length}`:"";

/* ---------- Hoja: formulario ---------- */
function openForm(c){
  const nuevo=!c;const d=c?JSON.parse(JSON.stringify(c)):{nombre:"",telefono:"",edad:"",genero:"Mujer",zona:"",radio:5,links:[],portfolio:[],notas:""};
  d.portfolio=d.portfolio||[];d.links=d.links||[];
  const pend={foto:null,port:[]};
  openSheet(`
    <div class="hd"><h2>${nuevo?"Nueva creadora":"Editar ficha"}<span class="dot">.</span></h2><button class="x" type="button" aria-label="Cerrar" id="cx">×</button></div>
    <form id="fm" novalidate>
      <div class="hd"><span id="fPrev">${avatar(d,"av big")}</span><div class="f" style="flex:1;min-width:0"><label for="fFoto">Foto de perfil</label><input id="fFoto" type="file" accept="image/*"></div></div>
      <div class="f"><label for="fNom">Nombre y apellido</label><input class="inp" id="fNom" required value="${esc(d.nombre)}" autocomplete="off"></div>
      <div class="two">
        <div class="f"><label for="fTel">Teléfono</label><input class="inp" id="fTel" type="tel" placeholder="+54 9 11 …" value="${esc(d.telefono)}"></div>
        <div class="f"><label for="fEdad">Edad</label><input class="inp" id="fEdad" type="number" min="14" max="99" value="${esc(d.edad)}"></div>
      </div>
      <div class="two">
        <div class="f"><label for="fGenS">Género</label><select class="inp" id="fGenS">${GENEROS.map(g=>`<option${g===d.genero?" selected":""}>${g}</option>`).join("")}</select></div>
        <div class="f"><label for="fRad">Radio de cobertura (km)</label><input class="inp" id="fRad" type="number" min="1" max="60" value="${esc(d.radio||5)}"></div>
      </div>
      <div class="f"><label for="fZonaS">¿Dónde vive?</label><select class="inp" id="fZonaS"><option value="">Elegí barrio o partido…</option>${GEO.map(p=>`<option${p.n===d.zona?" selected":""}>${esc(p.n)}</option>`).join("")}</select>
        <div class="loc" id="fLoc"></div>
        <div class="row"><button class="btn btn-ghost" type="button" id="fPick">Marcar en el mapa</button><input class="inp" id="fCoord" placeholder="o pegá coordenadas: -34.58, -58.43" style="flex:1;min-width:180px;width:auto"></div>
        <span class="hint">Las coordenadas salen de Google Maps: mantené apretado un punto y copiá los números.</span></div>
      <div class="f"><label for="fPort">Portfolio: fotos y videos</label><div class="grid" id="fGrid"></div><input id="fPort" type="file" accept="image/*,video/*" multiple></div>
      <div class="f"><label for="fLinks">Links (Instagram, TikTok, Drive), uno por línea</label><textarea class="inp" id="fLinks" rows="3">${esc(d.links.join("\n"))}</textarea></div>
      <div class="f"><label for="fNotas">Notas internas</label><textarea class="inp" id="fNotas" rows="2" placeholder="Rubros en los que trabajó, disponibilidad…">${esc(d.notas||"")}</textarea></div>
      <p class="err" id="fErr" hidden></p>
      <div class="row"><button class="btn btn-main" type="submit" id="fOk">${nuevo?"Guardar creadora":"Guardar cambios"}</button><button class="btn btn-ghost" type="button" id="fNo">Cancelar</button></div>
    </form>`);
  const showLoc=()=>{$("fLoc").textContent=typeof d.lat==="number"?`${d.zona||"Fuera de CABA y GBA"} · ${Math.abs(d.lat).toFixed(4)}° S, ${Math.abs(d.lng).toFixed(4)}° O`:"Sin ubicación todavía. Elegí la zona o marcala en el mapa."};
  const setPt=(lng,lat,fromZona)=>{d.lng=lng;d.lat=lat;if(!fromZona){const z=zonaDe(lng,lat);d.zona=z?z.n:"";$("fZonaS").value=z?z.n:""}showLoc()};
  showLoc();
  const grid=()=>{$("fGrid").innerHTML=d.portfolio.map((p,i)=>`<div>${p.tipo==="video"?`<video src="${imgSrc(p.id)}" muted></video>`:`<img src="${imgSrc(p.id)}" alt="">`}<button type="button" data-i="${i}" aria-label="Quitar">×</button></div>`).join("")+pend.port.map((f,i)=>`<div>${f.type.startsWith("video")?`<video src="${URL.createObjectURL(f)}" muted></video>`:`<img src="${URL.createObjectURL(f)}" alt="">`}<button type="button" data-p="${i}" aria-label="Quitar">×</button></div>`).join("");
    $("fGrid").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.i!=null)d.portfolio.splice(+b.dataset.i,1);else pend.port.splice(+b.dataset.p,1);grid()})};
  grid();
  $("cx").onclick=$("fNo").onclick=()=>{closeSheet();if(c)openFicha(c)};
  $("fFoto").onchange=e=>{const f=e.target.files[0];if(!f)return;pend.foto=f;$("fPrev").innerHTML=`<img class="av big" src="${URL.createObjectURL(f)}" alt="">`};
  $("fPort").onchange=e=>{pend.port.push(...e.target.files);e.target.value="";grid()};
  $("fZonaS").onchange=e=>{const p=GEO.find(x=>x.n===e.target.value);d.zona=e.target.value;if(p)setPt(p.c[0]+(Math.random()-.5)*.012,p.c[1]+(Math.random()-.5)*.012,true)};
  $("fCoord").onchange=e=>{const m=e.target.value.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);if(m)setPt(+m[2],+m[1]);else $("fLoc").textContent="No entendí esas coordenadas. Formato: -34.58, -58.43"};
  $("fPick").onclick=()=>{
    if(!renderer){$("fLoc").textContent="El mapa 3D no cargó en este dispositivo: elegí la zona o pegá coordenadas.";return}
    const keep=$("sheetCard");$("sheet").hidden=true;$("banner").hidden=false;stage.classList.add("placing");goal.el=Math.max(goal.el,1.2);
    S.placing=(lng,lat)=>{stopPlacing();setPt(lng,lat);$("sheet").hidden=false;keep.scrollTop=0};
  };
  $("fm").onsubmit=async e=>{e.preventDefault();
    const err=m=>{$("fErr").textContent=m;$("fErr").hidden=false};
    d.nombre=$("fNom").value.trim();d.telefono=$("fTel").value.trim();d.edad=$("fEdad").value?+$("fEdad").value:null;d.genero=$("fGenS").value;d.radio=+$("fRad").value||5;
    d.links=$("fLinks").value.split("\n").map(s=>s.trim()).filter(Boolean);d.notas=$("fNotas").value.trim();
    if(!d.nombre)return err("Falta el nombre.");
    if(typeof d.lat!=="number")return err("Falta la ubicación: elegí la zona o marcala en el mapa.");
    if(!S.db)return err("No se puede guardar desde esta vista. Abrí el mapa en claude.ai con tu cuenta.");
    if((pend.foto||pend.port.length)&&!S.assets)return err("Tu acceso no permite subir archivos. Pedí permiso de edición.");
    $("fOk").disabled=true;$("fOk").textContent="Guardando…";
    try{
      if(pend.foto){const small=await achicar(pend.foto,480);const r=await S.assets.upload(small);d.foto=r.id}
      for(let i=0;i<pend.port.length;i++){const f=pend.port[i];$("fOk").textContent=`Subiendo ${i+1} de ${pend.port.length}…`;const isV=f.type.startsWith("video");const blob=isV?f:await achicar(f,1600);const r=await S.assets.upload(blob);d.portfolio.push({id:r.id,tipo:isV?"video":"imagen"})}
      pend.port=[];pend.foto=null;
      const id=await guardar(d);closeSheet();S.sel=id;
      const [x,z]=toXZ(d.lng,d.lat);goal.tx=x;goal.tz=z;goal.dist=Math.min(goal.dist,40);
    }catch(x){$("fOk").disabled=false;$("fOk").textContent="Reintentar";err(x.code==="too_large"?"Un archivo pesa más de 20 MB. Subí una versión más liviana.":"No se pudo guardar: "+(x.message||x.code||x))}
  };
}
function stopPlacing(){S.placing=null;$("banner").hidden=true;stage.classList.remove("placing")}
$("cancelPlace").onclick=()=>{stopPlacing();$("sheet").hidden=false};
$("addBtn").onclick=()=>openForm(null);
function achicar(file,max){return new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));if(k===1&&file.size<1.5e6)return res(file);const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>res(b||file),"image/jpeg",.86)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

/* ---------- Persistencia ---------- */
async function guardar(d){const {id,...data}=d;data.actualizada=new Date().toISOString();
  if(id){await S.db.collection("creadoras").doc(id).set(data);return id}
  return (await S.db.collection("creadoras").add(data)).id}
async function borrar(c){await S.db.collection("creadoras").doc(c.id).delete();
  if(S.assets)for(const a of [c.foto,...(c.portfolio||[]).map(p=>p.id)].filter(Boolean)){try{await S.assets.delete(a)}catch(e){}}}

function setStatus(t,on){const s=$("status");s.textContent=t;s.classList.toggle("off",!on)}
(async()=>{
  const timer=setTimeout(()=>{if(S.mode==="cargando"){S.mode="sin";setStatus("Sin conexión",false);render()}},10000);
  const db=await Promise.resolve(window.claude?.use?.("db")).catch(()=>null);
  if(!db){clearTimeout(timer);S.mode="sin";setStatus("Vista sin guardado",false);render();return}
  S.db=db;
  Promise.resolve(window.claude.use("assets")).then(a=>{S.assets=a}).catch(()=>{});
  db.collection("creadoras").onSnapshot(snap=>{clearTimeout(timer);S.mode="ok";S.creadoras=snap.docs.map(x=>({id:x.id,...x.data()}));setStatus("En vivo",true);render();
    if(S.sel&&!$("sheet").hidden&&!$("fm")){const c=S.creadoras.find(x=>x.id===S.sel);if(c)openFicha(c)}},
    e=>{clearTimeout(timer);S.mode="sin";setStatus("No se pudo leer la base",false);render()});
})();

if(init3D()){bindInput();const caba=parts.CABA;goal.tx=cam.tx=caba.cx;goal.tz=cam.tz=caba.cz+4;requestAnimationFrame(frame)}
else{$("stage").innerHTML=`<div class="empty" style="position:absolute;inset:auto 0 40% 0"><b>El mapa 3D no pudo arrancar<span class="dot">.</span></b>Tu navegador no tiene WebGL activo. La lista y las fichas siguen funcionando.</div>`}
render();
</script>
